<!-- PAYMENT / INSTALLMENT MANAGEMENT -->
<section id="payments" class="page-section">

    <div class="section-header">
        <div>
            <h2>Payment / Installment</h2>
            <p>JUS-FEB Payment Entry & Collection</p>
        </div>

        <button class="primary-btn" onclick="openPaymentForm()">
            + Add Payment
        </button>
    </div>

    <div class="stats-grid">

        <div class="stat-card">
            <h4>Total Payments</h4>
            <strong id="totalPayments">0</strong>
        </div>

        <div class="stat-card">
            <h4>Total Collected</h4>
            <strong id="totalCollected">৳ 0</strong>
        </div>

        <div class="stat-card">
            <h4>Total Due</h4>
            <strong id="paymentTotalDue">৳ 0</strong>
        </div>

    </div>


    <div class="table-box">

        <div class="table-title">

            <h3>Payment History</h3>

            <input
                type="text"
                id="paymentSearch"
                placeholder="Search payment..."
                onkeyup="searchPayments()"
            >

        </div>


        <div class="table-responsive">

            <table>

                <thead>
                    <tr>
                        <th>SL</th>
                        <th>Payment ID</th>
                        <th>Account ID</th>
                        <th>Member ID</th>
                        <th>Date</th>
                        <th>Payment Type</th>
                        <th>Amount</th>
                        <th>Note</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="paymentTableBody">

                    <tr>
                        <td colspan="9" style="text-align:center;">
                            No payment recorded yet
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>


<!-- PAYMENT FORM MODAL -->

<div id="paymentModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h3>Add Payment / Installment</h3>

            <button onclick="closePaymentForm()">×</button>

        </div>


        <div class="form-grid">

            <div class="form-group">

                <label>Payment ID</label>

                <input
                    type="text"
                    id="paymentId"
                    placeholder="Enter Payment ID"
                >

            </div>


            <div class="form-group">

                <label>Account ID</label>

                <input
                    type="text"
                    id="paymentAccountId"
                    placeholder="Enter Account ID"
                >

            </div>


            <div class="form-group">

                <label>Member ID</label>

                <input
                    type="text"
                    id="paymentMemberId"
                    placeholder="Enter Member ID"
                >

            </div>


            <div class="form-group">

                <label>Payment Date</label>

                <input
                    type="date"
                    id="paymentDate"
                >

            </div>


            <div class="form-group">

                <label>Payment Type</label>

                <select id="paymentType">

                    <option value="Installment">
                        Installment
                    </option>

                    <option value="Full Payment">
                        Full Payment
                    </option>

                    <option value="Service Charge">
                        Service Charge
                    </option>

                    <option value="Interest">
                        Interest
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Payment Method</label>

                <select id="paymentMethod">

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="Bank">
                        Bank
                    </option>

                    <option value="Mobile Banking">
                        Mobile Banking
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Paid Amount</label>

                <input
                    type="number"
                    id="paymentAmount"
                    placeholder="Enter Amount"
                    min="0"
                >

            </div>


            <div class="form-group">

                <label>Note</label>

                <input
                    type="text"
                    id="paymentNote"
                    placeholder="Optional note"
                >

            </div>

        </div>


        <div class="modal-footer">

            <button
                class="secondary-btn"
                onclick="closePaymentForm()"
            >
                Cancel
            </button>


            <button
                class="primary-btn"
                onclick="savePayment()"
            >
                Save Payment
            </button>

        </div>

    </div>

</div>


<script>

let payments = [];


function openPaymentForm(){

    document.getElementById("paymentModal").style.display =
        "flex";


    const dateField =
        document.getElementById("paymentDate");

    if(!dateField.value){

        dateField.value =
            new Date().toISOString().split("T")[0];

    }

}


function closePaymentForm(){

    document.getElementById("paymentModal").style.display =
        "none";

}


function savePayment(){

    const payment = {

        id:
            document.getElementById("paymentId")
            .value.trim(),

        accountId:
            document.getElementById("paymentAccountId")
            .value.trim(),

        memberId:
            document.getElementById("paymentMemberId")
            .value.trim(),

        date:
            document.getElementById("paymentDate")
            .value,

        type:
            document.getElementById("paymentType")
            .value,

        method:
            document.getElementById("paymentMethod")
            .value,

        amount:
            Number(
                document.getElementById("paymentAmount")
                .value
            ) || 0,

        note:
            document.getElementById("paymentNote")
            .value.trim()

    };


    if(!payment.id ||
       !payment.accountId ||
       !payment.memberId){

        alert(
            "Payment ID, Account ID and Member ID are required."
        );

        return;

    }


    if(payment.amount <= 0){

        alert(
            "Please enter a valid payment amount."
        );

        return;

    }


    payments.push(payment);


    /*
     * Update related loan/account
     */

    const loan =
        loans.find(
            item => item.accountId === payment.accountId
        );


    if(loan){

        loan.paid =
            Number(loan.paid || 0) +
            payment.amount;


        loan.due =
            Math.max(
                Number(loan.total || 0) -
                loan.paid,
                0
            );


        if(loan.due === 0){

            loan.status = "Completed";

        }

    }


    renderPayments();


    if(typeof renderLoans === "function"){

        renderLoans();

    }


    closePaymentForm();

    clearPaymentForm();

}


function clearPaymentForm(){

    document.getElementById("paymentId").value = "";

    document.getElementById("paymentAccountId").value = "";

    document.getElementById("paymentMemberId").value = "";

    document.getElementById("paymentDate").value = "";

    document.getElementById("paymentAmount").value = "";

    document.getElementById("paymentNote").value = "";

}


function renderPayments(){

    const tbody =
        document.getElementById("paymentTableBody");


    tbody.innerHTML = "";


    if(payments.length === 0){

        tbody.innerHTML = `

            <tr>

                <td colspan="9"
                    style="text-align:center;">

                    No payment recorded yet

                </td>

            </tr>

        `;

        updatePaymentStats();

        return;

    }


    payments.forEach((payment,index)=>{

        tbody.innerHTML += `

            <tr>

                <td>${index + 1}</td>

                <td>${payment.id}</td>

                <td>${payment.accountId}</td>

                <td>${payment.memberId}</td>

                <td>${payment.date}</td>

                <td>
                    ${payment.type}
                    <br>
                    <small>${payment.method}</small>
                </td>

                <td>
                    ৳ ${payment.amount.toLocaleString()}
                </td>

                <td>${payment.note || "-"}</td>

                <td>

                    <button
                        onclick="deletePayment(${index})"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });


    updatePaymentStats();

}


function deletePayment(index){

    if(!confirm("Delete this payment?")){

        return;

    }


    const payment =
        payments[index];


    /*
     * Reverse payment from related account
     */

    const loan =
        loans.find(
            item => item.accountId === payment.accountId
        );


    if(loan){

        loan.paid =
            Math.max(
                Number(loan.paid || 0) -
                Number(payment.amount || 0),
                0
            );


        loan.due =
            Math.max(
                Number(loan.total || 0) -
                loan.paid,
                0
            );


        if(loan.due > 0 &&
           loan.status === "Completed"){

            loan.status = "Active";

        }

    }


    payments.splice(index,1);


    renderPayments();


    if(typeof renderLoans === "function"){

        renderLoans();

    }

}


function updatePaymentStats(){

    const collected =
        payments.reduce(
            (sum,payment)=>
                sum + Number(payment.amount || 0),
            0
        );


    const due =
        loans.reduce(
            (sum,loan)=>
                sum + Number(loan.due || 0),
            0
        );


    document.getElementById("totalPayments")
        .innerText =
        payments.length;


    document.getElementById("totalCollected")
        .innerText =
        "৳ " + collected.toLocaleString();


    document.getElementById("paymentTotalDue")
        .innerText =
        "৳ " + due.toLocaleString();

}


function searchPayments(){

    const search =
        document.getElementById("paymentSearch")
        .value.toLowerCase();


    document
        .querySelectorAll("#paymentTableBody tr")
        .forEach(row=>{

            row.style.display =
                row.innerText
                .toLowerCase()
                .includes(search)
                ? ""
                : "none";

        });

}

</script>
