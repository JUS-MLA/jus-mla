<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS-FEB - Owner Only</title>
<style>
body{margin:0;background:#0a3d8f;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;width:88%;max-width:360px;padding:24px;border-radius:18px}
h2{color:#0b4da1;text-align:center;margin:0}
.sub{text-align:center;color:#666;font-size:13px;margin:5px 0 18px 0}
label{font-size:13px;font-weight:bold;display:block;margin-top:10px}
input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;background:#eef3ff}
button{width:100%;padding:13px;margin-top:18px;background:#0b4da1;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:15px}
</style>
</head>
<body>
<div class="box">
  <h2>JUS-FEB</h2>
  <div class="sub">Management & Accounting System</div>

  <label>Username</label>
  <input id="user" placeholder="Enter username">

  <label>Password</label>
  <input id="pass" type="password" placeholder="Enter password">

  <button onclick="login()">🔒 Login</button>

  <div style="text-align:center;margin-top:15px">
    <a href="index.html" style="font-size:12px;color:#0b4da1;text-decoration:none">← Back to Home</a>
  </div>
</div>

<script>
function login(){
  if(user.value=="admin" && pass.value=="JUS@2026"){
    localStorage.setItem("owner","yes");
    location.href="dashboard.html";
  }else{
    alert("Wrong Password!");
  }
}
</script>
</body>
</html>
