<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JUS-FEB Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #166534;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .logo p {
      color: #555;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #166534;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #166534;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #14532d;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #166534;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>JUS-FEB</h1>
      <p>Management & Accounting System</p>
    </div>

    <form onsubmit="login(event)">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >
      </div>

      <button type="submit" class="login-btn">
        LOGIN
      </button>

      <div id="message" class="message"></div>

    </form>

    <a href="index.html" class="back">
      ← Back to Home
    </a>

    <div class="footer">
      Janakalyan Unnayan Sohayok - (JUS)<br>
      Family Enterprise Business - (FEB)
    </div>

  </div>

  <script>

    function login(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      if (username === "admin" && password === "JUS@2026") {

        localStorage.setItem("jus_login", "true");
        localStorage.setItem("jus_role", "Main Admin");

        message.style.color = "green";
        message.textContent = "Login successful...";

        setTimeout(function() {
          window.location.href = "admin.html";
        }, 700);

      } else {

        message.style.color = "red";
        message.textContent =
          "Invalid username or password.";

      }

    }

  </script>

</body>
</html>
