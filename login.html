<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUS-FEB Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b5ed7, #073b8c);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-box {
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #073b8c;
      font-size: 32px;
      margin-bottom: 6px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #0b5ed7;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #073b8c;
    }

    .error {
      display: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 10px;
      border-radius: 7px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: none;
      background: #e3f8e8;
      color: #187a32;
      padding: 10px;
      border-radius: 7px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
    }

    .demo {
      margin-top: 18px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .demo strong {
      color: #073b8c;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      text-decoration: none;
      color: #0b5ed7;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #ddd;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="login-box">

      <div class="logo">
        <h1>JUS-FEB</h1>
        <p>Management & Accounting System</p>
      </div>

      <div id="errorMessage" class="error"></div>
      <div id="successMessage" class="success"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginRole">Login Role</label>

          <select id="loginRole">
            <option value="Main Admin">Main Admin</option>
            <option value="Branch User">Branch User</option>
          </select>
        </div>

        <button type="submit" class="login-btn">
          🔐 Login
        </button>

      </form>

      <div class="demo">
        <strong>Demo Login</strong><br>
        Username: <strong>admin</strong><br>
        Password: <strong>JUS@2026</strong><br>
        Role: <strong>Main Admin</strong>
      </div>

      <a href="index.html" class="back">
        ← Back to Home
      </a>

    </div>

    <div class="footer">
      JUS-FEB Management & Accounting System
    </div>

  </div>

  <script>

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const role =
        document.getElementById("loginRole").value;

      const errorMessage =
        document.getElementById("errorMessage");

      const successMessage =
        document.getElementById("successMessage");

      errorMessage.style.display = "none";
      successMessage.style.display = "none";

      /*
        Demo Admin Login
      */

      if (
        username === "admin" &&
        password === "JUS@2026" &&
        role === "Main Admin"
      ) {

        localStorage.setItem("jus_login", "true");
        localStorage.setItem("jus_role", "Main Admin");
        localStorage.setItem("jus_username", username);
        localStorage.setItem("jus_login_time", new Date().toISOString());

        successMessage.innerText =
          "Login successful. Opening Admin Panel...";

        successMessage.style.display = "block";

        setTimeout(function() {
          window.location.href = "admin.html";
        }, 500);

        return;
      }

      /*
        Demo Branch User Login
        This is for testing the branch system.
      */

      if (
        username === "branch" &&
        password === "JUS@2026" &&
        role === "Branch User"
      ) {

        localStorage.setItem("jus_login", "true");
        localStorage.setItem("jus_role", "Branch User");
        localStorage.setItem("jus_username", username);
        localStorage.setItem("jus_login_time", new Date().toISOString());

        successMessage.innerText =
          "Login successful. Opening Branch Panel...";

        successMessage.style.display = "block";

        setTimeout(function() {
          window.location.href = "branch.html";
        }, 500);

        return;
      }

      /*
        Invalid Login
      */

      errorMessage.innerText =
        "Invalid username, password or role.";

      errorMessage.style.display = "block";

    });

  </script>

</body>
</html>
