<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS-FEB Owner Login</title>
<style>
body{margin:0;background:#0b2e65;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;width:90%;max-width:350px;padding:22px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
h2{color:#0b4da1;text-align:center;margin:0 0 5px 0}
p{text-align:center;color:#666;font-size:12px;margin:0 0 15px 0}
label{font-size:13px;font-weight:bold}
input{width:100%;padding:11px;margin:6px 0 12px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;background:#e8eef8}
button{width:100%;padding:12px;background:#0b4da1;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}
.info{background:#eef3ff;padding:10px;border-radius:8px;margin-top:12px;font-size:11px;color:#0b4da1;line-height:16px}
</style>
</head>
<body>

<div class="box">
  <h2>JUS-FEB</h2>
  <p>Management & Accounting System</p>
  
  <label>Username</label>
  <input id="user" value="admin" placeholder="Username">
  
  <label>Password</label>
  <input id="pass" type="password" value="JUS@2026" placeholder="Password">
  
  <button onclick="ownerLogin()">Login as Owner</button>

  <div class="info">
    <b>Owner Login</b><br>
    Username: <b>admin</b><br>
    Password: <b>JUS@2026</b>
  </div>
  
  <div style="text-align:center;margin-top:10px">
    <a href="index.html" style="font-size:12px;color:#0b4da1;text-decoration:none">← Back to Home</a>
  </div>
</div>

<script>
function ownerLogin(){
  // শুধু তোমার জন্য
  if(user.value === "admin" && pass.value === "JUS@2026"){
    localStorage.setItem("jus_owner","yes");
    window.location.href = "dashboard.html"; // তোমার Main Dashboard
  } else {
    alert("ভুল Username বা Password!");
  }
}
</script>

</body>
</html>
