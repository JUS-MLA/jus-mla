<!-- DASHBOARD LIVE DATA INTEGRATION -->

<script>

function updateDashboardData(){

    const totalMemberCount =
        typeof members !== "undefined"
        ? members.length
        : 0;

    const totalAccountCount =
        typeof loans !== "undefined"
        ? loans.length
        : 0;

    const totalCollectedAmount =
        typeof payments !== "undefined"
        ? payments.reduce(
            (sum,payment) =>
                sum + Number(payment.amount || 0),
            0
        )
        : 0;

    const totalDueAmount =
        typeof loans !== "undefined"
        ? loans.reduce(
            (sum,loan) =>
                sum + Number(loan.due || 0),
            0
        )
        : 0;


    /* Possible Dashboard IDs */

    const memberElements = [
        "dashboardMembers",
        "totalDashboardMembers",
        "dashMembers",
        "totalMembers"
    ];

    const accountElements = [
        "dashboardAccounts",
        "totalDashboardAccounts",
        "dashAccounts",
        "totalLoans"
    ];

    const collectionElements = [
        "dashboardCollection",
        "totalDashboardCollection",
        "dashCollection",
        "totalCollected"
    ];

    const dueElements = [
        "dashboardDue",
        "totalDashboardDue",
        "dashDue",
        "totalDue"
    ];


    updateElements(
        memberElements,
        totalMemberCount
    );


    updateElements(
        accountElements,
        totalAccountCount
    );


    updateElements(
        collectionElements,
        "৳ " +
        totalCollectedAmount.toLocaleString()
    );


    updateElements(
        dueElements,
        "৳ " +
        totalDueAmount.toLocaleString()
    );

}


function updateElements(
    elementIds,
    value
){

    elementIds.forEach(id => {

        const element =
            document.getElementById(id);

        if(element){

            element.innerText = value;

        }

    });

}


/*
 * Refresh Dashboard after
 * Member is added.
 */

const originalSaveMember =
    window.saveMember;

if(typeof originalSaveMember === "function"){

    window.saveMember = function(){

        originalSaveMember();

        setTimeout(
            updateDashboardData,
            100
        );

    };

}


/*
 * Refresh Dashboard after
 * Loan is added.
 */

const originalSaveLoan =
    window.saveLoan;

if(typeof originalSaveLoan === "function"){

    window.saveLoan = function(){

        originalSaveLoan();

        setTimeout(
            updateDashboardData,
            100
        );

    };

}


/*
 * Refresh Dashboard after
 * Payment is added.
 */

const originalSavePayment =
    window.savePayment;

if(typeof originalSavePayment === "function"){

    window.savePayment = function(){

        originalSavePayment();

        setTimeout(
            updateDashboardData,
            100
        );

    };

}


/*
 * Refresh Dashboard when page loads.
 */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        setTimeout(
            updateDashboardData,
            300
        );

    }
);

</script>
