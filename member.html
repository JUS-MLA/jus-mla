<!-- MEMBER MANAGEMENT -->
<section id="members" class="page-section">

    <div class="section-header">
        <div>
            <h2>Member Management</h2>
            <p>JUS-FEB Member Information</p>
        </div>

        <button class="primary-btn" onclick="openMemberForm()">
            + Add Member
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h4>Total Members</h4>
            <strong id="totalMembers">0</strong>
        </div>

        <div class="stat-card">
            <h4>Active Members</h4>
            <strong id="activeMembers">0</strong>
        </div>

        <div class="stat-card">
            <h4>Inactive Members</h4>
            <strong id="inactiveMembers">0</strong>
        </div>
    </div>

    <div class="table-box">
        <div class="table-title">
            <h3>Member List</h3>

            <input
                type="text"
                id="memberSearch"
                placeholder="Search member..."
                onkeyup="searchMembers()"
            >
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>SL</th>
                        <th>Member ID</th>
                        <th>Name</th>
                        <th>NID Number</th>
                        <th>Mobile</th>
                        <th>Branch</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="memberTableBody">
                    <tr>
                        <td colspan="8" style="text-align:center;">
                            No member added yet
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</section>


<!-- MEMBER FORM MODAL -->
<div id="memberModal" class="modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3>Add New Member</h3>

            <button onclick="closeMemberForm()">×</button>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Member ID</label>
                <input type="text" id="memberId"
                       placeholder="Enter Member ID">
            </div>

            <div class="form-group">
                <label>Member Name</label>
                <input type="text" id="memberName"
                       placeholder="Enter Member Name">
            </div>

            <div class="form-group">
                <label>NID Number</label>
                <input type="text" id="memberNid"
                       placeholder="Enter NID Number">
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="memberMobile"
                       placeholder="Enter Mobile Number">
            </div>

            <div class="form-group">
                <label>Branch</label>
                <input type="text" id="memberBranch"
                       placeholder="Enter Branch">
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="memberStatus">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

        </div>

        <div class="modal-footer">
            <button class="secondary-btn"
                    onclick="closeMemberForm()">
                Cancel
            </button>

            <button class="primary-btn"
                    onclick="saveMember()">
                Save Member
            </button>
        </div>

    </div>
</div>


<style>

.page-section{
    padding:20px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-header h2{
    margin:0;
}

.section-header p{
    margin-top:5px;
    color:#777;
}

.primary-btn{
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    background:#198754;
    color:white;
    font-weight:bold;
}

.secondary-btn{
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    background:#6c757d;
    color:white;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    padding:18px;
    border-radius:10px;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-card h4{
    margin:0 0 8px;
}

.stat-card strong{
    font-size:24px;
}

.table-box{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.table-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.table-title input{
    padding:9px;
    border:1px solid #ddd;
    border-radius:7px;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th,
table td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:left;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    background:#fff;
    width:95%;
    max-width:700px;
    padding:20px;
    border-radius:12px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header button{
    border:none;
    background:none;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group input,
.form-group select{
    padding:10px;
    border:1px solid #ddd;
    border-radius:7px;
}

.modal-footer{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

@media(max-width:600px){

    .stats-grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .section-header{
        align-items:flex-start;
        gap:10px;
    }

}

</style>


<script>

let members = [];

function openMemberForm(){
    document.getElementById("memberModal").style.display = "flex";
}

function closeMemberForm(){
    document.getElementById("memberModal").style.display = "none";
}

function saveMember(){

    const member = {
        id: document.getElementById("memberId").value.trim(),
        name: document.getElementById("memberName").value.trim(),
        nid: document.getElementById("memberNid").value.trim(),
        mobile: document.getElementById("memberMobile").value.trim(),
        branch: document.getElementById("memberBranch").value.trim(),
        status: document.getElementById("memberStatus").value
    };

    if(!member.id || !member.name){
        alert("Member ID and Member Name are required.");
        return;
    }

    members.push(member);

    renderMembers();

    closeMemberForm();

    document.getElementById("memberId").value = "";
    document.getElementById("memberName").value = "";
    document.getElementById("memberNid").value = "";
    document.getElementById("memberMobile").value = "";
    document.getElementById("memberBranch").value = "";
}

function renderMembers(){

    const tbody = document.getElementById("memberTableBody");

    tbody.innerHTML = "";

    if(members.length === 0){
        tbody.innerHTML = `
            <tr>
                <td colspan="8" style="text-align:center;">
                    No member added yet
                </td>
            </tr>
        `;
        updateMemberStats();
        return;
    }

    members.forEach((member,index)=>{

        tbody.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${member.id}</td>
                <td>${member.name}</td>
                <td>${member.nid}</td>
                <td>${member.mobile}</td>
                <td>${member.branch}</td>
                <td>${member.status}</td>
                <td>
                    <button onclick="deleteMember(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;

    });

    updateMemberStats();
}

function deleteMember(index){

    if(confirm("Delete this member?")){
        members.splice(index,1);
        renderMembers();
    }

}

function updateMemberStats(){

    document.getElementById("totalMembers").innerText =
        members.length;

    document.getElementById("activeMembers").innerText =
        members.filter(m => m.status === "Active").length;

    document.getElementById("inactiveMembers").innerText =
        members.filter(m => m.status === "Inactive").length;
}

function searchMembers(){

    const search =
        document.getElementById("memberSearch")
        .value.toLowerCase();

    document.querySelectorAll("#memberTableBody tr")
    .forEach(row=>{

        row.style.display =
            row.innerText.toLowerCase().includes(search)
            ? ""
            : "none";

    });

}

</script>
