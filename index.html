<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#020a1e;background-image:linear-gradient(rgba(59,130,246,0.12) 1px, transparent 1px),linear-gradient(90deg, rgba(59,130,246,0.12) 1px, transparent 1px);background-size:40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo-box{background:#fff;width:150px;height:90px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(96,165,250,0.5);font-weight:900;font-size:42px;color:#0ea5e9;letter-spacing:1px}
.title{font-size:48px;font-weight:800;color:#38bdf8;margin-top:12px}
.sub{color:#38bdf8;letter-spacing:4px;font-size:10px}
.login-card{margin-top:22px;background:rgba(255,255,255,0.09);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.18);border-radius:18px;padding:20px;width:100%;max-width:360px}
select,input{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:none;outline:none;font-size:14px}
.btn{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.lock{font-size:11px;color:#7dd3fc;margin:2px 0 6px 4px}
</style>
</head>
<body>

<div class="logo-box">JUS</div>
<div class="title">JUS</div>
<div class="sub">TRUST • QUALITY • GROWTH</div>

<div class="login-card">
  <select id="role" onchange="checkRole()">
    <option value="">Select Role</option>
    <option>Owner</option>
    <option>Owner Branch</option>
    <option>Owner Shop</option>
    <option>Client</option>
    <option>Branch Client</option>
    <option>Shop Client</option>
  </select>
  <input type="text" id="org" placeholder="Organization Name">
  <div id="orgLock" class="lock">Select Role First</div>
  <input type="text" id="phone" placeholder="Phone Number">
  <input type="password" id="pass" placeholder="Password">
  <button class="btn" onclick="doLogin()">LOGIN - AUTO SAVE</button>
  <p id="msg" style="color:#7dd3fc;font-size:12px;margin-top:10px;text-align:center"></p>
</div>

<script>
window.onload=function(){
  if(localStorage.getItem("jus_phone")){
    document.getElementById('role').value=localStorage.getItem("jus_role")||"";
    document.getElementById('org').value=localStorage.getItem("jus_org")||"";
    document.getElementById('phone').value=localStorage.getItem("jus_phone")||"";
    document.getElementById('pass').value=localStorage.getItem("jus_pass")||"";
    checkRole();
  }
}
function checkRole(){
  let r=document.getElementById('role').value, o=document.getElementById('org'), l=document.getElementById('orgLock');
  if(r==="Owner"){o.disabled=true;o.style.background="#cbd5e1";l.innerHTML="🔒 Locked for Owner";l.style.color="#f87171";}
  else{o.disabled=false;o.style.background="#fff";l.innerHTML=r?"✏️ Editable for "+r:"Select Role First";l.style.color="#7dd3fc";}
}
function doLogin(){
  let r=document.getElementById('role').value, org=document.getElementById('org').value, ph=document.getElementById('phone').value, pa=document.getElementById('pass').value;
  if(!r||!ph||!pa){document.getElementById('msg').innerText="❌ Fill Role, Phone, Password";return;}
  localStorage.setItem("jus_role",r);localStorage.setItem("jus_org",org);localStorage.setItem("jus_phone",ph);localStorage.setItem("jus_pass",pa);
  document.getElementById('msg').innerText="✅ Saved! Welcome "+r;
}
</script>
</body>
</html>
