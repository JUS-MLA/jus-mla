<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS - Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;background:#020a1e;background-image:linear-gradient(rgba(59,130,246,0.12) 1px, transparent 1px),linear-gradient(90deg, rgba(59,130,246,0.12) 1px, transparent 1px);background-size:40px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo-box{background:#fff;width:160px;border-radius:16px;padding:12px;box-shadow:0 0 25px rgba(96,165,250,0.5)}
.logo-box img{width:100%;display:block}
.title{font-size:48px;font-weight:800;background:linear-gradient(#7dd3fc,#0ea5e9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-top:12px}
.sub{color:#38bdf8;letter-spacing:4px;font-size:10px;margin-top:2px}
.login-card{margin-top:25px;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.18);border-radius:18px;padding:22px;width:100%;max-width:360px}
select,input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;outline:none;font-size:14px}
.btn{width:100%;padding:12px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer}
.lock{font-size:11px;color:#7dd3fc;text-align:left;margin:2px 0 6px 4px}
</style>
</head>
<body>

<div class="logo-box"><img src="logo.png" alt="JUS"></div>
<div class="title">JUS</div>
<div class="sub">TRUST • QUALITY • GROWTH</div>

<div class="login-card">
  <select id="role" onchange="checkRole()">
    <option value="">Select Role</option>
    <option value="Owner">Owner</option>
    <option value="Owner Branch">Owner Branch</option>
    <option value="Owner Shop">Owner Shop</option>
    <option value="Client">Client</option>
    <option value="Branch Client">Branch Client</option>
    <option value="Shop Client">Shop Client</option>
  </select>

  <input type="text" id="org" placeholder="Organization Name">
  <div id="orgLock" class="lock">Select Role First</div>

  <input type="text" id="phone" placeholder="Phone Number">
  <input type="password" id="pass" placeholder="Password">
  
  <button class="btn" onclick="doLogin()">LOGIN</button>
  <p id="msg" style="color:#7dd3fc;font-size:12px;margin-top:10px;text-align:center"></p>
</div>

<script>
// Auto Load
window.onload = function(){
  if(localStorage.getItem("jus_phone")){
    document.getElementById('role').value = localStorage.getItem("jus_role")||"";
    document.getElementById('org').value = localStorage.getItem("jus_org")||"";
    document.getElementById('phone').value = localStorage.getItem("jus_phone")||"";
    document.getElementById('pass').value = localStorage.getItem("jus_pass")||"";
    checkRole();
  }
}
function checkRole(){
  let role = document.getElementById('role').value;
  let org = document.getElementById('org');
  let lock = document.getElementById('orgLock');
  if(role==="Owner"){
    org.disabled=true; org.style.background="#cbd5e1";
    lock.innerHTML="🔒 Locked for Owner"; lock.style.color="#f87171";
  } else {
    org.disabled=false; org.style.background="#fff";
    lock.innerHTML= role ? "✏️ Editable for "+role : "Select Role First";
    lock.style.color="#7dd3fc";
  }
}
function doLogin(){
  let role=document.getElementById('role').value, org=document.getElementById('org').value, phone=document.getElementById('phone').value, pass=document.getElementById('pass').value;
  if(!role||!phone||!pass){ document.getElementById('msg').innerText="❌ Fill Role, Phone, Password"; return; }
  localStorage.setItem("jus_role",role); localStorage.setItem("jus_org",org); localStorage.setItem("jus_phone",phone); localStorage.setItem("jus_pass",pass);
  document.getElementById('msg').innerText="✅ Auto Saved! Welcome "+role;
  setTimeout(()=>{ alert("Login Success: "+role+" | "+phone); },600);
}
</script>
</body>
</html>
