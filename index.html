<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{min-height:100vh;background:#020a1e;background-image:linear-gradient(rgba(59,130,246,0.15) 1px, transparent 1px),linear-gradient(90deg, rgba(59,130,246,0.15) 1px, transparent 1px);background-size:42px 42px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo{background:#fff;width:160px;height:85px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:48px;color:#0a7bc2;box-shadow:0 0 25px rgba(56,189,248,0.6)}
.t1{font-size:42px;font-weight:800;color:#38bdf8;margin-top:10px}
.t2{color:#7dd3fc;font-size:11px;margin-top:4px;text-align:center}
.card{margin-top:20px;background:rgba(255,255,255,0.10);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);border-radius:18px;padding:20px;width:100%;max-width:380px}
input,select{width:100%;padding:12px;margin:6px 0 10px 0;border-radius:10px;border:none;outline:none;font-size:14px}
.btn{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:800;margin-top:8px;cursor:pointer}
.lock{font-size:11px;margin:-4px 0 10px 4px}
</style>
</head>
<body>
<div class="logo">JUS</div>
<div class="t1">JUS</div>
<div class="t2">Janakalyan Unnayan Sohayok (JUS)<br>TRUST • QUALITY • GROWTH</div>

<div class="card">
  <select id="role" onchange="checkRole()">
    <option value="">Select Role</option>
    <option value="Owner">Owner</option>
    <option value="Owner Branch">Owner Branch</option>
    <option value="Owner Shop">Owner Shop</option>
    <option value="Client">Client</option>
    <option value="Branch Client">Branch Client</option>
    <option value="Shop Client">Shop Client</option>
  </select>

  <input type="text" id="org" placeholder="Organization Name">
  <div id="orgLock" class="lock" style="color:#7dd3fc">Select Role First</div>

  <input type="text" id="branch" placeholder="Branch & Shop Name">
  <input type="text" id="phone" placeholder="Phone Number">
  <input type="password" id="pass" placeholder="Password">
  <button class="btn" onclick="doLogin()">LOGIN - AUTO SAVE</button>
  <p id="msg" style="color:#7dd3fc;font-size:12px;text-align:center;margin-top:10px"></p>
</div>

<script>
function checkRole(){
 let role = document.getElementById('role').value;
 let org = document.getElementById('org');
 let lock = document.getElementById('orgLock');

   lock.style.color = "#4ade80";
