<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS - Login</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#1649b5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.logo-wrap{text-align:center;margin-bottom:18px}
.logo-wrap img{height:70px;width:auto}
.logo-wrap h1{margin:8px 0 2px;color:#1649b5;font-size:28px;letter-spacing:1px}
.logo-wrap p{margin:0;color:#5a6d8a;font-size:14px;line-height:1.3}
label{display:block;margin:16px 0 6px;font-weight:600;font-size:14px;color:#1e293b}
input,select{width:100%;padding:12px 14px;border:1.5px solid #dbe2ea;border-radius:10px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#1649b5}
.btn{width:100%;margin-top:20px;background:#1649b5;color:#fff;border:none;padding:13px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn:hover{background:#123a90}
.links{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
.links a{color:#1649b5;text-decoration:none;font-weight:600;cursor:pointer}
.demo{background:#eef4ff;border-radius:10px;padding:12px 14px;margin-top:18px;font-size:13px;line-height:1.6}
.back{text-align:center;margin-top:16px}
.back a{color:#1649b5;text-decoration:none;font-weight:600;font-size:14px}
/* OTP Modal */
#otpModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:999}
.modal-box{background:#fff;padding:22px;border-radius:14px;width:90%;max-width:360px}
.modal-box h3{margin:0 0 10px;color:#1649b5}
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img src="logo.png" alt="JUS Logo">
    <h1>JUS</h1>
    <p>Janakalyan Unnayan Sohayok - JUS<br>Management & Accounting System</p>
  </div>

  <label>Mobile Number</label>
  <input type="tel" id="mobile" placeholder="Enter mobile number e.g. 017XXXXXXXX">

  <label>Username</label>
  <input type="text" id="username" placeholder="Enter username">

  <label>Password</label>
  <input type="password" id="password" placeholder="Enter password">

  <label>Login Role</label>
  <select id="role">
    <option>Branch User</option>
    <option>Main Admin</option>
    <option>Accountant</option>
    <option>Field Officer</option>
  </select>

  <div class="links">
    <a onclick="openForgot()">Forgot Password?</a>
    <a>Need Help?</a>
  </div>

  <button class="btn" onclick="login()">🔐 Login</button>

  <div class="demo">
    <b style="color:#1649b5">Demo Login</b><br>
    Username: <b>admin</b><br>
    Password: <b>JUS@2026</b><br>
    Role: <b>Main Admin</b>
  </div>

  <div class="back"><a href="#">← Back to Home</a></div>
</div>

<!-- Forgot Password OTP Modal -->
<div id="otpModal">
  <div class="modal-box">
    <h3>Forgot Password - OTP Verification</h3>
    <label>Enter Mobile Number</label>
    <input type="tel" id="forgotMobile" placeholder="017XXXXXXXX">
    <button class="btn" onclick="sendOTP()">Send OTP</button>
    <div id="otpSection" style="display:none">
      <label>Enter OTP (Demo: 123456)</label>
      <input type="text" id="otpInput" placeholder="Enter 6 digit OTP">
      <label>New Password</label>
      <input type="password" id="newPass" placeholder="New password">
      <button class="btn" onclick="resetPass()">Reset Password</button>
    </div>
    <p style="text-align:center;margin-top:12px"><a onclick="closeForgot()" style="cursor:pointer;color:#64748b">Close</a></p>
  </div>
</div>

<script>
function login(){
  let u=document.getElementById('username').value;
  let p=document.getElementById('password').value;
  if(u==='admin' && p==='JUS@2026'){alert('Login Successful! Welcome to JUS');}
  else if(u && p){alert('Login checking... (Connect with your backend)');}
  else{alert('Please enter username & password');}
}
function openForgot(){document.getElementById('otpModal').style.display='flex';}
function closeForgot(){document.getElementById('otpModal').style.display='none';document.getElementById('otpSection').style.display='none';}
function sendOTP(){
  let m=document.getElementById('forgotMobile').value;
  if(m.length<11){alert('Valid mobile number daw');return;}
  alert('OTP sent to '+m+' (Demo OTP: 123456)');
  document.getElementById('otpSection').style.display='block';
}
function resetPass(){
  let otp=document.getElementById('otpInput').value;
  if(otp==='123456'){alert('Password reset successful! Now login with new password');closeForgot();}
  else{alert('Wrong OTP! Use 123456 for demo');}
}
</script>

</body>
</html>
