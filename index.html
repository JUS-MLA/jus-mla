<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JUS - Owner Admin</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#12307e}
.login-wrap{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.card{background:#fff;width:100%;max-width:430px;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.logo{text-align:center}.logo img{height:75px;width:75px;border-radius:50%;border:2px solid #e2e8f0}
label{font-size:13px;font-weight:700;margin:11px 0 5px;display:block;color:#1e293b}
input,select{width:100%;padding:11px 12px;border:1.5px solid #dbe2ea;border-radius:10px;font-size:14px}
input[readonly]{background:#f1f5f9;font-weight:600}
.pass-wrap{position:relative}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer}
.btn{width:100%;background:#12307e;color:#fff;border:none;padding:13px;border-radius:12px;font-weight:bold;margin-top:16px;cursor:pointer}
.links{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.links a{color:#12307e;font-weight:700;text-decoration:none}
#dashboard{display:none;background:#f1f5f9;min-height:100vh}
.header{background:#12307e;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.sidebar{width:250px;background:#0f255e;min-height:100vh;float:left;padding:15px}
.sidebar a{display:block;padding:10px;color:#cbd5e1;text-decoration:none;border-radius:8px;margin-bottom:5px;font-size:14px}
.sidebar a.active{background:#1e3a8a;color:#fff}
.main{margin-left:250px;padding:18px}
.box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:15px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>

<div id="loginSec" class="login-wrap">
<div class="card">
<div class="logo">
<img src="logo.png" onerror="this.src='https://via.placeholder.com/75?text=JUS'">
<h2 style="margin:6px 0 2px;color:#12307e">JUS</h2>
<p style="margin:0;font-size:12px;color:#64748b">Janakalyan Unnayan Sohayok - JUS<br>Management & Accounting System</p>
</div>

<label>Select Role</label>
<select id="role" onchange="handleRole()">
<option>Owner Admin</option>
<option>User Control Admin User</option>
<option>Owner Branch User</option>
<option>Client Branch User</option>
<option>Client User</option>
</select>

<label>Organization Name</label>
<input type="text" id="orgName" value="Janakalyan Unnayan Sohayok - JUS" readonly>

<label>Owner / Client Name</label>
<input type="text" id="ownerName" value="MD. LIMON AHAMMED">

<label>BD Phone Number</label>
<input type="tel" id="phone" value="01949915225">

<label>Username</label>
<input type="text" id="username" value="mdlimonahammed2004@mla">

<label>Password</label>
<div class="pass-wrap">
<input type="password" id="password" value="Limon915225@">
<span class="eye" onclick="togglePass()">👁️</span>
</div>

<div class="links">
<a>Forgot Password?</a>
<a>Need Help?</a>
</div>

<button class="btn" onclick="doLogin()">🔐 Login</button>
</div>
</div>

<div id="dashboard">
<div class="header">
<div><b>Janakalyan Unnayan Sohayok - JUS</b><br><small id="uInfo"></small></div>
<button onclick="doLogout()" style="background:#ef4444;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer">Logout</button>
</div>
<div class="sidebar" id="sideMenu"></div>
<div class="main">
<div id="createBox" class="box" style="display:none;border-left:5px solid #12307e">
<h3>👑 Create User (Only Owner Admin)</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<select id="newRole"><option>User Control Admin User</option><option>Owner Branch User</option><option>Client Branch User</option><option>Client User</option></select>
<input id="newName" placeholder="Name">
<input id="newPhone" placeholder="Phone">
<input id="newUser" placeholder="Username">
<input id="newPass" placeholder="Password" type="password">
<input id="newOrg" placeholder="Organization">
</div>
<button class="btn" onclick="createUser()" style="margin-top:10px">➕ Create & Save</button>
</div>
<div class="box"><table id="userTable"></table></div>
</div>
</div>

<script>
let users=JSON.parse(localStorage.getItem('jus_users')||'[]');
if(users.length===0){users=[{role:'Owner Admin',name:'MD. LIMON AHAMMED',phone:'01949915225',username:'mdlimonahammed2004@mla',password:'Limon915225@',org:'Janakalyan Unnayan Sohayok - JUS'}];localStorage.setItem('jus_users',JSON.stringify(users));}
let cur=null;
function handleRole(){
let r=document.getElementById('role').value;
let org=document.getElementById('orgName');
if(r==='Owner Admin' || r==='User Control Admin User' || r==='Owner Branch User'){
org.value='Janakalyan Unnayan Sohayok - JUS';
org.readOnly=true;
org.style.background='#f1f5f9';
}else{
org.value='';
org.readOnly=false;
org.style.background='#fff';
org.placeholder='Enter Your Organization Name';
}
}
function togglePass(){let p=document.getElementById('password');p.type=p.type==='password'?'text':'password';}
function doLogin(){
let r=document.getElementById('role').value;
let u=document.getElementById('username').value;
let p=document.getElementById('password').value;
let f=users.find(x=>x.username===u && x.password===p && x.role===r);
if(!f){alert('Role / Username / Password ভুল');return;}
cur=f;document.getElementById('loginSec').style.display='none';document.getElementById('dashboard').style.display='block';
document.getElementById('uInfo').innerText=f.role+' | '+f.name;
let menu=document.getElementById('sideMenu');
if(f.role==='Owner Admin'){
menu.innerHTML=`<b style="color:#94a3b8;font-size:11px">OWNER ADMIN ONLY</b><a class="active">🏢 All Owner Branch</a><a>🏦 All Client Branch</a><a>👥 All Client</a><a>🚨 Cheating Option</a>`;
document.getElementById('createBox').style.display='block';
}else{
menu.innerHTML=`<a class="active">🏠 ${f.role} Dashboard</a>`;
document.getElementById('createBox').style.display='none';
}
render();
}
function render(){
let t=document.getElementById('userTable');
t.innerHTML='<tr><th>Role</th><th>Name</th><th>Username</th><th>Action</th></tr>';
users.forEach((u,i)=>{
let del=cur.role==='Owner Admin' && u.role!=='Owner Admin'?`<button onclick="delUser(${i})" style="background:#dc2626;color:#fff;border:none;padding:5px 10px;border-radius:6px">Delete</button>`:(u.role==='Owner Admin'?'Protected':'No Permission');
t.innerHTML+=`<tr><td>${u.role}</td><td>${u.name}</td><td>${u.username}</td><td>${del}</td></tr>`;
});
}
function createUser(){
let r=document.getElementById('newRole').value;
let n=document.getElementById('newName').value;
let ph=document.getElementById('newPhone').value;
let un=document.getElementById('newUser').value;
let pw=document.getElementById('newPass').value;
let org=document.getElementById('newOrg').value || (r.includes('Client')?'Client Org - '+n:'Janakalyan Unnayan Sohayok - JUS');
if(!n||!un||!pw){alert('Name, Username, Password দাও');return;}
users.push({role:r,name:n,phone:ph,username:un,password:pw,org:org});
localStorage.setItem('jus_users',JSON.stringify(users));
render();
}
function delUser(i){if(cur.role!=='Owner Admin')return;if(confirm('Delete?')){users.splice(i,1);localStorage.setItem('jus_users',JSON.stringify(users));render();}}
function doLogout(){document.getElementById('dashboard').style.display='none';document.getElementById('loginSec').style.display='flex';}
handleRole();
</script>
</body>
</html>
