<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUS - Official Business Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{
  min-height:100vh;background:#020a1e;
  background-image:
    linear-gradient(rgba(59,130,246,0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,0.15) 1px, transparent 1px);
  background-size:45px 45px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;position:relative;
}
.logo-box{
  background:#fff;width:210px;border-radius:20px;padding:15px;
  box-shadow:0 0 35px rgba(96,165,250,0.6);z-index:2;
}
.logo-box img{width:100%;display:block}
.title{
  font-size:68px;font-weight:800;
  background:linear-gradient(#7dd3fc,#0ea5e9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-top:18px;z-index:2;
}
.sub{color:#38bdf8;letter-spacing:5px;font-size:13px;margin-top:4px;z-index:2}
.btn{
  background:#fff;color:#000;border:none;
  padding:11px 32px;border-radius:25px;font-weight:800;
  margin-top:18px;cursor:pointer;z-index:2;
}
.cards{display:flex;gap:15px;margin-top:35px;max-width:900px;width:100%;z-index:2}
.card{
  flex:1;background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);border-radius:14px;
  padding:20px;text-align:center;color:#fff;
}
.card b{display:block;margin-top:8px}
.card span{font-size:11px;color:#93c5fd;display:block;margin-top:5px}
@media(max-width:600px){.cards{flex-direction:column}.title{font-size:45px}}
</style>
</head>
<body>

<div class="logo-box">
  <img src="logo.png" alt="JUS">
</div>

<div class="title">JUS</div>
<div class="sub">TRUST • QUALITY • GROWTH</div>
<p style="color:#7dd
