<div id="ownerLoginOnly" style="max-width:400px;margin:20px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);font-family:Arial;text-align:center">

  <!-- Language Switch -->
  <div style="display:flex;gap:10px;margin-bottom:20px">
    <button onclick="setLang('bn')" id="btn_bn" style="flex:1;padding:11px;border-radius:25px;border:1.5px solid #6c5ce7;font-weight:bold;cursor:pointer">বাংলা</button>
    <button onclick="setLang('en')" id="btn_en" style="flex:1;padding:11px;border-radius:25px;border:1.5px solid #6c5ce7;font-weight:bold;cursor:pointer">English</button>
  </div>

  <!-- Logo -->
  <div style="position:relative;margin:0 auto 10px;width:90px;height:90px">
    <img id="logoView" src="" style="width:90px;height:90px;border-radius:50%;object-fit:cover;display:none;border:3px solid #6c5ce7">
    <div id="logoDefault" style="width:90px;height:90px;border-radius:50%;background:#f1f2f6;display:flex;align-items:center;justify-content:center;font-size:38px">🏪</div>
  </div>
  <input type="file" id="logoFile" accept="image/*" style="font-size:12px">
  <p id="t_logo" style="font-size:11px;color:#888;margin:6px 0 18px"></p>

  <div style="text-align:left">
    <label id="l_phone" style="font-size:13px;font-weight:bold"></label>
    <input id="f_phone" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label id="l_name" style="font-size:13px;font-weight:bold"></label>
    <input id="f_name" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label id="l_user" style="font-size:13px;font-weight:bold"></label>
    <input id="f_user" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label id="l_pass" style="font-size:13px;font-weight:bold"></label>
    <div style="position:relative">
      <input id="f_pass" type="password" style="width:100%;padding:12px 45px 12px 12px;margin:5px 0 10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">
      <!-- Fingerprint Icon Inside Password Field - প্রথমে Hide থাকবে -->
      <span id="fingerIcon" onclick="fingerLogin()" style="display:none;position:absolute;right:12px;top:14px;font-size:20px;cursor:pointer" title="Fingerprint">👆</span>
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin:5px 0 10px">
      <input type="checkbox" id="saveCheck" checked>
      <label for="saveCheck" id="l_save" style="font-size:13px;cursor:pointer"></label>
    </div>

    <button id="btn_login" onclick="doLogin()" style="width:100%;padding:13px;background:#6c5ce7;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:5px"></button>

    <!-- Fingerprint Button - প্রথমে Hide, Setting এ Enable করলে Show হবে -->
    <button id="btn_finger" onclick="fingerLogin()" style="display:none;width:100%;padding:12px;background:#fff;border:2px solid #6c5ce7;color:#6c5ce7;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:10px"></button>

    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <span id="t_forget" onclick="openForget()" style="font-size:12px;color:#6c5ce7;cursor:pointer;text-decoration:underline"></span>
      <span id="t_enable" onclick="enableFinger()" style="display:none;font-size:11px;color:#888;cursor:pointer"></span>
    </div>
    <p id="t_info" style="text-align:center;font-size:11px;color:#888;margin-top:12px"></p>
  </div>
</div>

<!-- Forget Modal -->
<div id="forgetBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:9999">
  <div style="background:#fff;padding:20px;border-radius:15px;width:90%;max-width:340px;text-align:center">
    <h4 id="f_title" style="margin:0 0 10px"></h4>
    <input id="f_verifyPhone" placeholder="01XXXXXXXXX" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin-bottom:10px">
    <input id="f_newPass" type="password" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin-bottom:12px">
    <div style="display:flex;gap:10px">
      <button onclick="closeForget()" style="flex:1;padding:10px;background:#eee;border:none;border-radius:8px">Cancel</button>
      <button id="f_btn" onclick="doForget()" style="flex:1;padding:10px;background:#6c5ce7;color:#fff;border:none;border-radius:8px"></button>
    </div>
  </div>
</div>

<script>
const LANG = {
  bn: {
    logo:"Logo / ছবি আপলোড", phone:"ফোন নাম্বার", ph_phone:"01XXXXXXXXX", name:"নাম", ph_name:"আপনার নাম", user:"User Name", ph_user:"User Name লিখুন", pass:"Password", ph_pass:"Password লিখুন", save:"Password Save রাখুন", login:"Login", fingerBtn:"👆 Fingerprint দিয়ে Login", forget:"Password ভুলে গেছেন?", enable:"Fingerprint চালু করুন", info:"প্রথমবার Login করলে Owner তৈরি হবে", fill:"সব ঘর পূরণ করুন", created:"Owner তৈরি হয়েছে ✅", success:"Login সফল", fail:"তথ্য মিলছে না", f_title:"ফোন নাম্বার দিয়ে Password Reset", f_btn:"Reset করুন", f_ph:"ফোন নাম্বার", f_np:"নতুন Password", needPhone:"ফোন নাম্বার দিন", noOwner:"Owner তৈরি হয়নি", wrongPhone:"ফোন নাম্বার মিলেনি", changed:"Password পরিবর্তন হয়েছে ✅", needFirst:"আগে একবার Login করুন", bioOk:"Fingerprint মিলেছে ✅", bioFail:"Fingerprint মেলেনি"
  },
  en: {
    logo:"Upload Logo / Photo", phone:"Phone Number", ph_phone:"01XXXXXXXXX", name:"Name", ph_name:"Your Name", user:"User Name", ph_user:"Enter User Name", pass:"Password", ph_pass:"Enter Password", save:"Save Password", login:"Login", fingerBtn:"👆 Login with Fingerprint", forget:"Forgot Password?", enable:"Enable Fingerprint", info:"First login will create Owner", fill:"Fill all fields", created:"Owner Created ✅", success:"Login Success", fail:"Not matched", f_title:"Reset with Phone Number", f_btn:"Reset Now", f_ph:"Phone Number", f_np:"New Password", needPhone:"Enter phone", noOwner:"No Owner yet", wrongPhone:"Phone not matched", changed:"Password Changed ✅", needFirst:"Login first", bioOk:"Fingerprint Matched ✅", bioFail:"Fingerprint Failed"
  }
};

let lang = localStorage.getItem('appLang') || 'bn';
function setLang(l){
  lang=l; localStorage.setItem('appLang',l);
  let t=LANG[l];
  document.getElementById('btn_bn').style.background=l=='bn'?'#6c5ce7':'#fff';
  document.getElementById('btn_bn').style.color=l=='bn'?'#fff':'#6c5ce7';
  document.getElementById('btn_en').style.background=l=='en'?'#6c5ce7':'#fff';
  document.getElementById('btn_en').style.color=l=='en'?'#fff':'#6c5ce7';
  document.getElementById('t_logo').innerText=t.logo;
  document.getElementById('l_phone').innerText=t.phone; document.getElementById('f_phone').placeholder=t.ph_phone;
  document.getElementById('l_name').innerText=t.name; document.getElementById('f_name').placeholder=t.ph_name;
  document.getElementById('l_user').innerText=t.user; document.getElementById('f_user').placeholder=t.ph_user;
  document.getElementById('l_pass').innerText=t.pass; document.getElementById('f_pass').placeholder=t.ph_pass;
  document.getElementById('l_save').innerText=t.save;
  document.getElementById('btn_login').innerText=t.login;
  document.getElementById('btn_finger').innerText=t.fingerBtn;
  document.getElementById('t_forget').innerText=t.forget;
  document.getElementById('t_enable').innerText=t.enable;
  document.getElementById('t_info').innerText=t.info;
  document.getElementById('f_title').innerText=t.f_title;
  document.getElementById('f_verifyPhone').placeholder=t.f_ph;
  document.getElementById('f_newPass').placeholder=t.f_np;
  document.getElementById('f_btn').innerText=t.f_btn;
}

// Logo
let lg=localStorage.getItem('ownerLogo'); if(lg){ logoView.src=lg; logoView.style.display='block'; logoDefault.style.display='none'; }
logoFile.addEventListener('change',e=>{ let r=new FileReader(); r.onload=()=>{ localStorage.setItem('ownerLogo',r.result); logoView.src=r.result; logoView.style.display='block'; logoDefault.style.display='none'; }; r.readAsDataURL(e.target.files[0]); });

// Load saved
let saved=JSON.parse(localStorage.getItem('savedLogin')||'null');
if(saved){ f_phone.value=saved.phone||''; f_name.value=saved.name||''; f_user.value=saved.user||''; f_pass.value=saved.pass||''; }

// Show fingerprint only if enabled in setting
if(localStorage.getItem('fingerEnabled')=='yes' && saved){
  document.getElementById('fingerIcon').style.display='block';
  document.getElementById('btn_finger').style.display='block';
  document.getElementById('t_enable').style.display='none';
} else if(saved){
  document.getElementById('t_enable').style.display='block'; // Show enable option
}

function getOwner(){ return JSON.parse(localStorage.getItem('ownerData')||'null'); }

function doLogin(){
  let t=LANG[lang];
  let ph=f_phone.value.trim(), nm=f_name.value.trim(), us=f_user.value.trim(), ps=f_pass.value.trim();
  if(!ph||!nm||!us||!ps) return alert(t.fill);
  let o=getOwner();
  if(!o){
    localStorage.setItem('ownerData', JSON.stringify({phone:ph,name:nm,user:us,pass:ps}));
    if(saveCheck.checked) localStorage.setItem('savedLogin', JSON.stringify({phone:ph,name:nm,user:us,pass:ps}));
    alert(t.created); location.reload(); return;
  }
  if(o.phone==ph && o.name==nm && o.user==us && o.pass==ps){
    if(saveCheck.checked) localStorage.setItem('savedLogin', JSON.stringify({phone:ph,name:nm,user:us,pass:ps}));
    alert(t.success+': '+nm);
  } else alert(t.fail);
}

// Enable Fingerprint from setting - তুমি Setting এ এই function call করবা
function enableFinger(){
  let s=JSON.parse(localStorage.getItem('savedLogin')||'null');
  if(!s) return alert(LANG[lang].needFirst);
  localStorage.setItem('fingerEnabled','yes');
  document.getElementById('fingerIcon').style.display='block';
  document.getElementById('btn_finger').style.display='block';
  document.getElementById('t_enable').style.display='none';
  alert(LANG[lang].bioOk + ' - Fingerprint Enabled');
}

async function fingerLogin(){
  let t=LANG[lang];
  let s=JSON.parse(localStorage.getItem('savedLogin')||'null');
  if(!s) return alert(t.needFirst);
  try{
    if(window.PublicKeyCredential){
      let ok=await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      if(ok){ f_phone.value=s.phone; f_name.value=s.name; f_user.value=s.user; f_pass.value=s.pass; return alert(t.bioOk); }
    }
    if(confirm('👆 Fingerprint')){ f_phone.value=s.phone; f_name.value=s.name; f_user.value=s.user; f_pass.value=s.pass; alert(t.bioOk); }
  }catch{ alert(t.bioFail); }
}

// Forget via Phone
function openForget(){ document.getElementById('forgetBox').style.display='flex'; }
function closeForget(){ document.getElementById('forgetBox').style.display='none'; }
function doForget(){
  let t=LANG[lang];
  let o=getOwner(); if(!o) return alert(t.noOwner);
  let vp=document.getElementById('f_verifyPhone').value.trim();
  let np=document.getElementById('f_newPass').value.trim();
  if(!vp||!np) return alert(t.needPhone);
  if(vp!=o.phone) return alert(t.wrongPhone);
  o.pass=np; localStorage.setItem('ownerData', JSON.stringify(o));
  let s=JSON.parse(localStorage.getItem('savedLogin')||'{}'); s.pass=np; localStorage.setItem('savedLogin', JSON.stringify(s));
  alert(t.changed); closeForget(); location.reload();
}

setLang(lang);
</script>
