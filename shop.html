<div id="ownerLoginOnly" style="max-width:400px;margin:20px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);font-family:Arial;text-align:center">

  <!-- Logo Upload - ছবি আপলোড এখানেই -->
  <div style="width:90px;height:90px;margin:0 auto 10px">
    <img id="logoView" src="" style="width:90px;height:90px;border-radius:50%;display:none;border:3px solid #6c5ce7;object-fit:cover">
    <div id="logoDefault" style="width:90px;height:90px;border-radius:50%;background:#f1f2f6;display:flex;align-items:center;justify-content:center;font-size:38px">🏪</div>
  </div>
  <input type="file" id="logoFile" accept="image/*" style="font-size:12px">
  <p style="font-size:11px;color:#888;margin:6px 0 18px">Upload Logo / Photo</p>

  <div style="text-align:left">
    <label style="font-size:13px;font-weight:bold">Phone Number</label>
    <input id="f_phone" placeholder="01XXXXXXXXX" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label style="font-size:13px;font-weight:bold">Name</label>
    <input id="f_name" placeholder="Your Name" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label style="font-size:13px;font-weight:bold">User Name</label>
    <input id="f_user" placeholder="Enter User Name" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label style="font-size:13px;font-weight:bold">Password</label>
    <div style="position:relative">
      <input id="f_pass" type="password" placeholder="Enter Password" style="width:100%;padding:12px 65px 12px 12px;margin:5px 0 10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">
      <span id="eyeIcon" onclick="togglePass()" style="position:absolute;right:38px;top:14px;font-size:18px;cursor:pointer">👁️</span>
      <span id="fingerIcon" onclick="fingerLogin()" style="display:none;position:absolute;right:10px;top:14px;font-size:19px;cursor:pointer">👆</span>
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin:5px 0 10px">
      <input type="checkbox" id="saveCheck" checked>
      <label for="saveCheck" style="font-size:13px">Save Password</label>
    </div>

    <button onclick="doLogin()" style="width:100%;padding:13px;background:#6c5ce7;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer">Login</button>

    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <span onclick="openForget()" style="font-size:12px;color:#6c5ce7;cursor:pointer;text-decoration:underline">Forgot Password?</span>
      <span onclick="openSetting()" style="font-size:11px;color:#888;cursor:pointer">⚙️ Setting</span>
    </div>
    <p style="text-align:center;font-size:11px;color:#888;margin-top:12px">First login will create Owner</p>
  </div>
</div>
