<div id="ownerLoginOnly" style="max-width:400px;margin:20px auto;background:#fff;padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);font-family:Arial;text-align:center">

  <!-- Language Switch -->
  <div style="display:flex;gap:10px;margin-bottom:20px">
    <button onclick="setLang('bn')" id="btn_bn" style="flex:1;padding:11px;border-radius:25px;border:1.5px solid #6c5ce7;font-weight:bold;cursor:pointer">বাংলা</button>
    <button onclick="setLang('en')" id="btn_en" style="flex:1;padding:11px;border-radius:25px;border:1.5px solid #6c5ce7;font-weight:bold;cursor:pointer">English</button>
  </div>

  <!-- Logo -->
  <div style="position:relative;margin:0 auto 10px;width:90px;height:90px">
    <img id="logoView" src="" style="width:90px;height:90px;border-radius:50%;object-fit:cover;display:none;border:3px solid #6c5ce7">
    <div id="logoDefault" style="width:90px;height:90px;border-radius:50%;background:#f1f2f6;display:flex;align-items:center;justify-content:center;font-size:38px">🏪</div>
  </div>
  <input type="file" id="logoFile" accept="image/*" style="font-size:12px">
  <p id="t_logo" style="font-size:11px;color:#888;margin:6px 0 18px"></p>

  <div style="text-align:left">
    <label id="l_phone" style="font-size:13px;font-weight:bold"></label>
    <input id="f_phone" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label id="l_name" style="font-size:13px;font-weight:bold"></label>
    <input id="f_name" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label id="l_user" style="font-size:13px;font-weight:bold"></label>
    <input id="f_user" style="width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">

    <label id="l_pass" style="font-size:13px;font-weight:bold"></label>
    <div style="position:relative">
      <input id="f_pass" type="password" style="width:100%;padding:12px 75px 12px 12px;margin:5px 0 10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box">
      <!-- Eye Icon - Show/Hide -->
      <span id="eyeIcon" onclick="togglePass()" style="position:absolute;right:42px;top:14px;font-size:18px;cursor:pointer;user-select:none">👁️</span>
      <!-- Fingerprint Icon - Setting এ Enable করলে আসবে -->
      <span id="fingerIcon" onclick="fingerLogin()" style="display:none;position:absolute;right:12px;top:14px;font-size:20px;cursor:pointer">👆</span>
    </div>

    <div style="display:flex;align-items:center;gap:6px;margin:5px 0 10px">
      <input type="checkbox" id="saveCheck" checked>
      <label for="saveCheck" id="l_save" style="font-size:13px;cursor:pointer"></label>
    </div>

    <button id="btn_login" onclick="doLogin()" style="width:100%;padding:13px;background:#6c5ce7;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:5px"></button>
    <button id="btn_finger" onclick="fingerLogin()" style="display:none;width:100%;padding:12px;background:#fff;border:2px solid #6c5ce7;color:#6c5ce7;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:10px"></button>

    <div style="display:flex;justify-content:space-between;margin-top:12px">
      <span id="t_forget" onclick="openForget()" style="font-size:12px;color:#6c5ce7;cursor:pointer;text-decoration:underline"></span>
      <span id="t_enable" onclick="enableFinger()" style="display:none;font-size:11px;color:#888;cursor:pointer"></span>
    </div>
    <p id="t_info" style="text-align:center;font-size:11px;color:#888;margin-top:12px"></p>
  </div>
</div>

<!-- Forget Modal -->
<div id="forgetBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:9999">
  <div style="background:#fff;padding:20px;border-radius:15px;width:90%;max-width:340px;text-align:center">
    <h4 id="f_title" style="margin:0 0 10px"></h4>
    <input id="f_verifyPhone" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin-bottom:10px">
    <input id="f_newPass" type="password" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin-bottom:12px">
    <div style="display:flex;gap:10px">
      <button onclick="closeForget()" id="f_cancel" style="flex:1;padding:10px;background:#eee;border:none;border-radius:8px"></button>
      <button id="f_btn" onclick="doForget()" style="flex:1;padding:10px;background:#6c5ce7;color:#fff;border:none;border-radius:8px"></button>
    </div>
  </div>
</div>

<script>
const LANG = {
  bn: { logo:"Logo / ছবি আপলোড", phone:"ফোন নাম্বার", ph_phone:"01XXXXXXXXX", name:"নাম", ph_name:"আপনার নাম", user:"User Name", ph_user:"User Name লিখুন", pass:"Password", ph_pass:"Password লিখুন", save:"Password Save রাখুন", login:"Login", fingerBtn:"👆 Fingerprint দিয়ে Login", forget:"Password ভুলে গেছেন?", enable:"Fingerprint চালু করুন", info:"প্রথমবার Login করলে Owner তৈরি হবে", fill:"সব ঘর পূরণ করুন", created:"Owner তৈরি হয়েছে ✅", success:"Login সফল", fail:"তথ্য মিলছে না", f_title:"ফোন দিয়ে Reset করুন", f_btn:"Reset করুন", f_cancel:"বাতিল", f_ph:"ফোন নাম্বার দিন", f_np:"নতুন Password দিন", wrongPhone:"ফোন মিলেনি", changed:"Password পরিবর্তন হয়েছে ✅" },
  en: { logo:"Upload Logo / Photo", phone:"Phone Number", ph_phone:"01XXXXXXXXX", name:"Name", ph_name:"Your Name", user:"User Name", ph_user:"Enter User Name", pass:"Password", ph_pass:"Enter Password", save:"Save Password", login:"Login", fingerBtn:"👆 Login with Fingerprint", forget:"Forgot Password?", enable:"Enable Fingerprint", info:"First login will create Owner", fill:"Fill all fields", created:"Owner Created ✅", success:"Login Success", fail:"Not matched", f_title:"Reset with Phone", f_btn:"Reset Now", f_cancel:"Cancel", f_ph:"Enter Phone", f_np:"Enter New Password", wrongPhone:"Phone not matched", changed:"Password Changed ✅" }
};

let lang = localStorage.getItem('appLang') || 'bn';
function setLang(l){
  lang=l; localStorage.setItem('appLang',l); let t=LANG[l];
  btn_bn.style.background=l=='bn'?'#6c5ce7':'#fff'; btn_bn.style.color=l=='bn'?'#fff':'#6c5ce7';
  btn_en.style.background=l=='en'?'#6c5ce7':'#fff'; btn_en.style.color=l=='en'?'#fff':'#6c5ce7';
  t_logo.innerText=t.logo; l_phone.innerText=t.phone; f_phone.placeholder=t.ph_phone;
  l_name.innerText=t.name; f_name.placeholder=t.ph_name;
  l_user.innerText=t.user; f_user.placeholder=t.ph_user;
  l_pass.innerText=t.pass; f_pass.placeholder=t.ph_pass;
  l_save.innerText=t.save; btn_login.innerText=t.login; btn_finger.innerText=t.fingerBtn;
  t_forget.innerText=t.forget; t_enable.innerText=t.enable; t_info.innerText=t.info;
  f_title.innerText=t.f_title; f_verifyPhone.placeholder=t.f_ph; f_newPass.placeholder=t.f_np;
  f_btn.innerText=t.f_btn; f_cancel.innerText=t.f_cancel;
}

let lg=localStorage.getItem('ownerLogo'); if(lg){ logoView.src=lg; logoView.style.display='block'; logoDefault.style.display='none'; }
logoFile.addEventListener('change',e=>{ let r=new FileReader(); r.onload=()=>{ localStorage.setItem('ownerLogo',r.result); logoView.src=r.result; logoView.style.display='block'; logoDefault.style.display='none'; }; r.readAsDataURL(e.target.files[0]); });

let saved=JSON.parse(localStorage.getItem('savedLogin')||'null');
if(saved){ f_phone.value=saved.phone||''; f_name.value=saved.name||''; f_user.value=saved.user||''; f_pass.value=saved.pass||''; }
if(localStorage.getItem('fingerEnabled')=='yes' && saved){ fingerIcon.style.display='block'; btn_finger.style.display='block'; }
else if(saved){ t_enable.style.display='block'; }

function getOwner(){ return JSON.parse(localStorage.getItem('ownerData')||'null'); }

// Show / Hide Password - এটাই তুমি চাইছিলা
function togglePass(){
  let p = document.getElementById('f_pass');
  let eye = document.getElementById('eyeIcon');
  if(p.type === 'password'){ p.type='text'; eye.innerText='🙈'; }
  else { p.type='password'; eye.innerText='👁️'; }
}

function doLogin(){
  let t=LANG[lang];
  let ph=f_phone.value.trim(), nm=f_name.value.trim(), us=f_user.value.trim(), ps=f_pass.value.trim();
  if(!ph||!nm||!us||!ps) return alert(t.fill);
  let o=getOwner();
  if(!o){ localStorage.setItem('ownerData', JSON.stringify({phone:ph,name:nm,user:us,pass:ps})); if(saveCheck.checked) localStorage.setItem('savedLogin', JSON.stringify({phone:ph,name:nm,user:us,pass:ps})); alert(t.created); location.reload(); return; }
  if(o.phone==ph && o.name==nm && o.user==us && o.pass==ps){ if(saveCheck.checked) localStorage.setItem('savedLogin', JSON.stringify({phone:ph,name:nm,user:us,pass:ps})); alert(t.success+': '+nm); } else alert(t.fail);
}

function enableFinger(){ let s=JSON.parse(localStorage.getItem('savedLogin')||'null'); if(!s) return alert(LANG[lang].fill); localStorage.setItem('fingerEnabled','yes'); fingerIcon.style.display='block'; btn_finger.style.display='block'; t_enable.style.display='none'; alert(LANG[lang].success); }
async function fingerLogin(){ let s=JSON.parse(localStorage.getItem('savedLogin')||'null'); if(!s) return alert(LANG[lang].fill); f_phone.value=s.phone; f_name.value=s.name; f_user.value=s.user; f_pass.value=s.pass; alert(LANG[lang].success); }

function openForget(){ forgetBox.style.display='flex'; }
function closeForget(){ forgetBox.style.display='none'; }
function doForget(){
  let o=getOwner(); let vp=f_verifyPhone.value.trim(); let np=f_newPass.value.trim();
  if(vp!=o.phone) return alert(LANG[lang].wrongPhone);
  o.pass=np; localStorage.setItem('ownerData', JSON.stringify(o)); let s=JSON.parse(localStorage.getItem('savedLogin')||'{}'); s.pass=np; localStorage.setItem('savedLogin', JSON.stringify(s));
  alert(LANG[lang].changed); closeForget(); location.reload();
}
setLang(lang);
</script>
