<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Management - JUS-FEB</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f8ff;margin:0}
.header{background:#0b46da;color:white;padding:15px;text-align:center}
.container{padding:15px;max-width:900px;margin:auto}
.card{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:15px}
input,select{width:100%;padding:10px;margin:5px 0 10px 0;border:1px solid #ccc;border-radius:6px}
.btn{background:#0b46da;color:white;border:none;padding:10px 15px;border-radius:6px;cursor:pointer}
.btn-green{background:#16a34a}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:14px}
th{background:#eef3ff}
</style>
</head>
<body>
<div class="header">
<h2 style="margin:0">Shop Management</h2>
<p style="margin:0;font-size:13px">JUS-FEB - Product, Sales & Stock</p>
</div>

<div class="container">
<div class="card">
<h3>নতুন প্রোডাক্ট যোগ করুন</h3>
<input id="pName" placeholder="প্রোডাক্ট নাম (যেমন: চাল)">
<input id="pPrice" type="number" placeholder="কেনা দাম">
<input id="sPrice" type="number" placeholder="বিক্রি দাম">
<input id="pStock" type="number" placeholder="স্টক পরিমান">
<button class="btn" onclick="addProduct()">প্রোডাক্ট Save করুন</button>
</div>

<div class="card">
<h3>প্রোডাক্ট লিস্ট ও বিক্রি</h3>
<input id="search" onkeyup="render()" placeholder="সার্চ করুন...">
<table>
<thead><tr><th>নাম</th><th>কেনা</th><th>বিক্রি</th><th>স্টক</th><th>অ্যাকশন</th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>

<div class="card">
<h3>আজকের হিসাব</h3>
<p>মোট বিক্রি: <b id="totalSale">0</b> টাকা</p>
<p>মোট লাভ: <b id="totalProfit">0</b> টাকা</p>
<button class="btn btn-green" onclick="location.href='index.html'">Back to Home</button>
</div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('jus_shop')||'[]');
let sales = JSON.parse(localStorage.getItem('jus_sales')||'[]');

function addProduct(){
 let name=document.getElementById('pName').value;
 let buy=+document.getElementById('pPrice').value;
 let sell=+document.getElementById('sPrice').value;
 let stock=+document.getElementById('pStock').value;
 if(!name||!buy||!sell) return alert('সব ঘর পূরণ করুন');
 products.push({id:Date.now(),name,buy,sell,stock});
 localStorage.setItem('jus_shop',JSON.stringify(products));
 document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('sPrice').value='';document.getElementById('pStock').value='';
 render();
}
function sellProduct(id){
 let p=products.find(x=>x.id==id);
 if(p.stock<=0) return alert('স্টক শেষ');
 let qty=parseInt(prompt('কত পিস বিক্রি?', '1'));
 if(!qty||qty>p.stock) return alert('স্টক কম আছে');
 p.stock-=qty;
 sales.push({amount:p.sell*qty, profit:(p.sell-p.buy)*qty, date:new Date().toLocaleDateString()});
 localStorage.setItem('jus_shop',JSON.stringify(products));
 localStorage.setItem('jus_sales',JSON.stringify(sales));
 render();
}
function deleteProduct(id){
 if(!confirm('ডিলিট করবেন?')) return;
 products=products.filter(x=>x.id!=id);
 localStorage.setItem('jus_shop',JSON.stringify(products));
 render();
}
function render(){
 let s=document.getElementById('search').value.toLowerCase();
 let html='';
 let filtered=products.filter(p=>p.name.toLowerCase().includes(s));
 filtered.forEach(p=>{
  html+=`<tr><td>${p.name}</td><td>${p.buy}</td><td>${p.sell}</td><td>${p.stock}</td><td><button class="btn btn-green" onclick="sellProduct(${p.id})">Sell</button> <button class="btn" style="background:#ef4444" onclick="deleteProduct(${p.id})">X</button></td></tr>`;
 });
 document.getElementById('list').innerHTML=html;
 document.getElementById('totalSale').innerText=sales.reduce((a,b)=>a+b.amount,0);
 document.getElementById('totalProfit').innerText=sales.reduce((a,b)=>a+b.profit,0);
}
render();
</script>
</body>
</html>
